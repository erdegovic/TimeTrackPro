name: Encrypted database backup

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encrypted-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_ENABLED: "true"
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_REGION: auto
      BACKUP_S3_BUCKET: tickd-backups
      BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      ACCOUNT_BACKUP_ENCRYPTION_KEY: ${{ secrets.ACCOUNT_BACKUP_ENCRYPTION_KEY }}

    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backup command
        run: npm run build

      - name: Create PostgreSQL 17 dump
        run: |
          docker run --rm \
            -e DATABASE_URL \
            -v "$RUNNER_TEMP:/backup" \
            postgres:17-alpine \
            sh -ec 'pg_dump --dbname="$DATABASE_URL" --format=custom --no-owner --no-acl --file=/backup/tickd.dump'

      - name: Encrypt and upload dump
        env:
          BACKUP_DATABASE_SOURCE_FILE: ${{ runner.temp }}/tickd.dump
        run: npm run backup:database
